[package]
name = "igs-rust"
version = "1.0.0"
edition = "2021"
description = "Intelligence Gathering System - RSS/HTTP source monitoring MCP server with NLP enrichment"
authors = ["Ishan Parihar"]
license = "MIT"
repository = "https://github.com/ishan-parihar/igs-rust"
homepage = "https://github.com/ishan-parihar/igs-rust"
keywords = ["mcp", "rss", "news", "intelligence", "scraper", "nlp"]
categories = ["command-line-utilities", "web-programming::scraping"]

[lib]
name = "igs_rust_mcp"
path = "src/lib.rs"

[[bin]]
name = "igs"
path = "src/cli.rs"

[dependencies]
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
toon-format = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "native-tls",
  "gzip",
  "brotli",
  "deflate",
] }
feed-rs = "2.4"
schemars = { version = "1.0", features = ["derive", "chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
scraper = "0.23"
url = "2.5"
html-to-markdown-rs = "3.5"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.31", features = ["bundled"] }
unpdf = "0.11"
openssl-sys = { version = "0.9.117", features = ["vendored"] }

toon-helper = { path = "../toon-helper" }
flate2 = "1.1.9"
tar = "0.4.46"
tokio-util = "0.7.19"
tempfile = "3.27.0"

[lints.clippy]
# Tier 1: Catch actual bugs
correctness = { level = "deny", priority = 10 }

# Tier 2: Performance warnings
perf = { level = "warn", priority = 5 }

# Tier 3: Targeted pedantic lints (full pedantic is too noisy for a binary)
redundant_clone = { level = "deny", priority = 9 }
needless_pass_by_value = { level = "warn", priority = 5 }

# Tier 4: Allow what's intentional for a CLI/MCP binary
unwrap_used = "allow"      # ponytail: IGS is a CLI/MCP binary; unwrap is acceptable at trust boundaries
expect_used = "allow"       # ponytail: expect with clear messages is fine in binary
todo = "warn"
unimplemented = "warn"
large_enum_variant = "allow" # ponytail: CLI enums are one-shot, variant size doesn't matter
must_use_candidate = "allow" # ponytail: binary tool, return values are consumed immediately
module_name_repetitions = "allow" # ponytail: e.g. news::fetch_news is intentional, not noise
