browser:
  default: obscura
  obscura:
    auto_update: true
    enabled: true
    max_concurrent: 10
    obey_robots: true
    stealth: true
    timeout_ms: 30000
cache:
  dir: cache
  enabled: true
  ttlMs: 1800000
http:
  backoffBaseMs: 500
  backoffFactor: 2.0
  concurrency: 6
  perHost: 2
  retries: 2
  timeoutMs: 15000
  userAgent: IGS/1.0.1 (+https://github.com/ishan-parihar/igs-rust)
nlp:
  enabled: true
  max_entities: 20
  max_topics: 8
output:
  default_format: toon
  dump_dir: ~/Documents/IGS
  dump_enabled: false
twitter:
  cookie: ""
  enabled: false

# ─── Reddit Integration ───────────────────────────────────────
# reddit.search and reddit.feed use cookie-based auth to bypass Akamai bot detection.
# Without a valid cookie both tools will return a clear error explaining what to do.
#
# How to get your Reddit cookie:
#   1. Open reddit.com in your browser and sign in (or use as guest)
#   2. Open DevTools → Network tab → refresh the page
#   3. Click any request to reddit.com → Headers → "Cookie:" request header
#   4. Copy the full value and paste it below
#
# Alternatively: set the IGS_REDDIT_COOKIE environment variable and use ${IGS_REDDIT_COOKIE}
reddit:
  enabled: false
  cookie: ""
