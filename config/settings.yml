browser:
  default: obscura
  obscura:
    auto_update: true
    enabled: true
    max_concurrent: 10
    obey_robots: true
    stealth: true
    timeout_ms: 30000
cache:
  dir: cache
  enabled: true
  ttlMs: 1800000
http:
  backoffBaseMs: 500
  backoffFactor: 2.0
  concurrency: 6
  perHost: 2
  retries: 2
  timeoutMs: 15000
  userAgent: IGS/1.0.0 (+https://github.com/ishan-parihar/igs-rust)
nlp:
  enabled: true
  max_entities: 20
  max_topics: 8
output:
  default_format: toon
  dump_dir: ~/Documents/IGS
  dump_enabled: false
twitter:
  cookie: ""
  enabled: false
