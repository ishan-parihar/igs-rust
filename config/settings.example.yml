# IGS MCP Server — Settings Configuration (Example)
# Copy this file to ~/.config/igs-mcp/settings.yml and customize.
# Environment variable substitution: ${VAR_NAME} is replaced at runtime.

# ─── HTTP Client ──────────────────────────────────────────────
http:
  userAgent: IGS/1.0.0 (+https://github.com/ishan-parihar/igs-rust)

  timeoutMs: 15000
  retries: 2
  backoffBaseMs: 500
  backoffFactor: 2.0
  concurrency: 6
  perHost: 2

# ─── Caching ──────────────────────────────────────────────────
cache:
  enabled: true
  dir: cache
  ttlMs: 1800000

# ─── Obscura Headless Browser ─────────────────────────────────
# Powers: web.search (via DDG), web.scrape (JS rendering), web.crawl, browser.*
browser:
  enabled: true
  default: obscura
  obscura:
    enabled: true
    auto_update: true
    obey_robots: true
    timeout_ms: 30000
    max_concurrent: 10
    stealth: true

# ─── NLP Enrichment (offline, no API calls) ──────────────────
nlp:
  enabled: true
  max_topics: 8
  max_entities: 20

# ─── Output Format ────────────────────────────────────────────
output:
  default_format: toon
  dump_enabled: false
  dump_dir: "~/Documents/IGS"

# ─── Tool Groups ───────────────────────────────────────────────
tool_groups: ["discovery", "news", "research", "web", "insights"]
